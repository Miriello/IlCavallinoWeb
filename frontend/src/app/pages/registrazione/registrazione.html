<section class="registrazione-page">

    <form (ngSubmit)="registrati()">

        <h1>Crea un account</h1>

        <label for="username">Username</label>
        <input
            id="username"
            type="text"
            name="username"
            [(ngModel)]="username"
            required
        >

        <label for="email">Email</label>
        <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
        >

        <button type="submit">Registrati</button>
        @if (messaggio) {<p class="successo">{{ messaggio }}</p>}
        @if (errore) {<p class="errore">{{ errore }}</p>}
        <p>
            Hai già un account?
            <a routerLink="/login">Accedi</a>
        </p>

    </form>

</section>
