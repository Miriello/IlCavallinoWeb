<section class="login-page">
  <form>
    <h1>Accedi</h1>
    
    <label for="username">Username</label>
    <input
      id="username"
      type="text"
      name="username"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      name="password"
      required
    >

    <button type="submit">Accedi</button>
    @if (errore) {<p class="errore">{{ errore }}</p>}
    <p>
      Non hai un account?
      <a routerLink="/registrazione">Registrati</a>
    </p>
  </form>
</section>
